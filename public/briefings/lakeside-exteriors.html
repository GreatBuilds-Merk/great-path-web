<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Briefing — Lakeside Exteriors, LLC</title>
<style>
  :root{
    --navy:#1C2E52;
    --navy-2:#24386a;
    --gold:#B0793A;          /* warm bronze — nods to Lakeside's metal/copper mark */
    --gold-soft:#f4ead9;
    --slate:#8A9BB5;
    --slate-light:#aab8cd;
    --green:#3FA24A;
    --red:#C0392B;
    --amber:#C77B23;
    --ink:#1f2733;
    --muted:#6b7686;
    --card:#F0F1F3;
    --card-2:#f6f7f9;
    --line:#e2e5ea;
    --page:#ffffff;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#4a4a4a;font-family:var(--font);color:var(--ink);padding:24px;-webkit-font-smoothing:antialiased;}

  .page{
    width:816px;min-height:1056px;background:var(--page);margin:0 auto 32px;
    position:relative;display:flex;flex-direction:column;
    box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:visible;
  }
  .page-body{flex:1;padding:26px 40px 18px;}

  .hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:30px 40px 0;}
  .hdr-title{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--navy);line-height:.95;}
  .hdr-sub{font-size:18px;font-weight:700;color:var(--gold);margin-top:6px;}
  .hdr-prep{font-size:13px;color:var(--muted);margin-top:5px;}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
  .date-badge{
    background:var(--navy);color:#fff;font-size:13px;font-weight:600;
    padding:8px 16px 8px 26px;position:relative;
    clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);
  }
  .rule{height:3px;background:var(--gold);margin:20px 40px 0;border-radius:2px;}
  .rule.thin{height:2px;background:var(--line);}

  /* ---------- Logo chip (real Lakeside emblem on dark tile) ---------- */
  .logo{display:flex;align-items:center;gap:11px;}
  .logo .chip{display:none;background:#0c0c0c;border-radius:12px;padding:6px;display:flex;
    box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .logo .chip img{display:block;height:62px;width:auto;border-radius:7px;}
  .logo-txt{line-height:1.05;}
  .logo-txt .l1{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.3px;}
  .logo-txt .l2{font-size:8.5px;font-weight:700;color:var(--slate);letter-spacing:1.6px;margin-top:3px;}

  .sec{display:flex;align-items:center;gap:12px;margin:20px 0 13px;}
  .sec .badge{width:38px;height:38px;border-radius:50%;background:var(--navy);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sec.gold .badge{background:var(--gold);}
  .sec .badge svg{width:20px;height:20px;}
  .sec h2{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:.3px;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;}

  .goal{background:var(--card);border-radius:10px;padding:14px 16px;display:flex;gap:14px;margin-bottom:12px;}
  .goal .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;
    font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .goal h3{font-size:14.5px;font-weight:800;color:var(--navy);margin-bottom:3px;}
  .goal p{font-size:12.5px;line-height:1.45;color:var(--muted);}

  .kpi{background:var(--card);border-radius:10px;padding:14px 16px;display:grid;
    grid-template-columns:46px 1fr auto;gap:14px;align-items:center;margin-bottom:12px;}
  .kpi .ic{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .kpi .ic svg{width:24px;height:24px;}
  .kpi .lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
  .kpi .val{font-size:26px;font-weight:800;color:var(--navy);line-height:1.05;margin-top:2px;}
  .kpi .delta{text-align:right;}
  .kpi .delta .big{font-size:15px;font-weight:800;}
  .kpi .delta .cmp{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35;}
  .up{color:var(--green);}.down{color:var(--green);}

  .chart-card{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:16px 14px 8px;}
  .legend{display:flex;gap:22px;justify-content:center;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--ink);}
  .legend span{display:flex;align-items:center;gap:7px;}
  .legend i{width:22px;height:3px;border-radius:2px;display:inline-block;}

  /* ---------- Mini chart row (page 1) ---------- */
  .mini-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:14px;}
  .mini-card{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 12px 10px;display:flex;flex-direction:column;}
  .mini-ttl{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:8px;text-align:center;}
  .mini-note{font-size:10px;line-height:1.35;color:var(--muted);margin-top:7px;text-align:center;}
  .pie-legend{margin-top:8px;display:flex;flex-direction:column;gap:3px;}
  .pie-legend .row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ink);}
  .pie-legend .row i{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
  .pie-legend .row .v{margin-left:auto;font-weight:800;color:var(--navy);}

  .callout{background:var(--card);border-radius:10px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start;margin-top:18px;}
  .callout .badge{width:44px;height:44px;border-radius:50%;background:var(--navy);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .callout .badge svg{width:24px;height:24px;}
  .callout .ttl{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;line-height:1.2;width:82px;flex-shrink:0;}
  .callout p{font-size:12.5px;line-height:1.55;color:var(--ink);}
  .callout.wide .ttl{display:flex;align-items:center;}
  .callout.challenge{background:#fbf3e8;border:1px solid #e6d3b4;}
  .callout.challenge .badge{background:var(--amber);}
  .callout.challenge .ttl{color:var(--amber);}

  /* ---------- Next-level strategic band ---------- */
  .bigmove{background:linear-gradient(135deg,#274179 0%,#1C2E52 65%,#14213f 100%);
    border-radius:12px;padding:18px 22px;display:flex;gap:16px;align-items:flex-start;
    margin-top:18px;color:#fff;box-shadow:0 6px 18px rgba(28,46,82,.28);
    border:1px solid #2c3f6b;position:relative;overflow:hidden;}
  .bigmove:before{content:"";position:absolute;top:-40px;right:-30px;width:150px;height:150px;
    border-radius:50%;background:radial-gradient(circle,rgba(176,121,58,.28),transparent 70%);}
  .bigmove .badge{width:46px;height:46px;border-radius:50%;background:var(--gold);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3);}
  .bigmove .badge svg{width:24px;height:24px;}
  .bigmove .bm-body{position:relative;z-index:1;}
  .bigmove .kick{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;}
  .bigmove h3{font-size:15.5px;font-weight:800;color:#fff;margin:3px 0 7px;letter-spacing:.2px;}
  .bigmove p{font-size:12.3px;line-height:1.55;color:#dfe6f1;}
  .bigmove p b{color:#fff;}
  .bigmove .moves{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:11px;}
  .bigmove .mv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:8px;padding:10px 11px;}
  .bigmove .mv .t{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:3px;}
  .bigmove .mv .d{font-size:11px;line-height:1.4;color:#d3dcea;}

  .item{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .ic{width:34px;height:34px;border-radius:50%;background:var(--navy);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .item.gold .ic{background:var(--gold);}
  .item .ic svg{width:18px;height:18px;}
  .item h4{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:2px;}
  .item p{font-size:12px;line-height:1.45;color:var(--muted);}
  .panel{background:var(--card);border-radius:10px;padding:6px 16px;}

  .bar-block{margin-bottom:6px;}
  .bar-block .bhd{display:flex;align-items:center;gap:9px;margin-bottom:2px;}
  .bar-block .bhd .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .bar-block .bhd .ic svg{width:14px;height:14px;}
  .bar-block .bhd h4{font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:.3px;}
  .bar-row{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;}
  .bar-note{font-size:11px;line-height:1.4;color:var(--muted);}

  .action{background:var(--card);border-radius:10px;padding:13px 15px;display:flex;gap:13px;margin-bottom:11px;}
  .action .num{font-size:30px;font-weight:800;color:var(--gold);line-height:1;flex-shrink:0;width:26px;}
  .action h4{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:5px;}
  .action ul{list-style:none;margin:0 0 7px;}
  .action li{font-size:12px;color:var(--muted);line-height:1.4;padding-left:12px;position:relative;margin-bottom:2px;}
  .action li:before{content:"•";position:absolute;left:0;color:var(--gold);font-weight:800;}
  .action .step{font-size:11.5px;line-height:1.4;background:var(--card-2);border-left:3px solid var(--gold);
    padding:6px 9px;border-radius:0 5px 5px 0;color:var(--ink);}
  .action .step b{color:var(--navy);}

  .ftr{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;
    padding:12px 40px;font-size:12px;font-weight:600;letter-spacing:.4px;margin-top:16px;}
  .ftr .tag b{color:var(--gold);}
  .ftr .pg{background:var(--gold);color:#fff;font-weight:700;padding:6px 18px 6px 26px;
    clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);margin-right:-40px;}

  @media print{body{background:#fff;padding:0;}.page{box-shadow:none;margin:0;}.page+.page{page-break-before:always;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = {

  report:{
    title:"OWNER DASHBOARD",

  },

  months:["FEB 2026","MAR 2026","APR 2026","MAY 2026","JUN 2026","JUL 2026"],
  monthsShort:["FEB","MAR","APR","MAY","JUN","JUL"],
  series:{
    pipeline:    [520000,610000,680000,590000,720000,780000],  // weighted pipeline value ($)

  },

  revenueMix:[
    {label:"Remodels", value:500000, color:"#1C2E52"},
    {label:"Decks / Patios", value:360000, color:"#B0793A"},
    {label:"Stonework", value:310000, color:"#8A9BB5"},
    {label:"Commercial", value:130000, color:"#C77B23"},
    {label:"Other", value:140000, color:"#c2cddc"}
  ],

  goals:[
    {t:"HIT $1.8M ON QUALITY WORK", d:"Reach $1.8M in booked revenue for 2026 without compromising the craftsmanship standard that commands premium pricing."},
    {t:"KEEP THE PIPELINE FULL", d:"Hold the pipeline at 3–4× the next quarter's revenue target so signed work stays lined up with crew availability."},
    {t:"PROTECT MARGIN & CRAFTSMANSHIP", d:"Keep gross margin above 33% and a 90+ quality score on every completed job through crew training and scoring."}
  ],

  kpis:[
    {icon:"funnel", label:"OPPORTUNITY PIPELINE", value:"$780K", delta:"8.3%", dir:"up",
     m:"vs. Jun 2026", y:"+$260K since Feb"},
    {icon:"bar", label:"BOOKED REVENUE · YTD", value:"$1.44M", delta:"80%", dir:"up",
     m:"of $1.8M goal", y:"ahead of seasonal pace"},

  highlight:"Pipeline reached $780K in July, up 8.3% from June and $260K since February — the clearest signal that the year is on track. Booked revenue stands at $1.44M, roughly 80% of the $1.8M goal and ahead of the seasonal pace with more work still to build. Backlog sits at 5.1 months of scheduled work, so crews are booked out well into Q4. A deep, high-intent pipeline and a full backlog are the clearest signs that the months ahead are well covered.",

  takeaways:[
    {icon:"funnel", t:"Pipeline Is the Engine", d:"Pipeline hit $780K, up 8% for the month. A deep, high-intent pipeline is the best early read on whether 2026 lands on plan — and whether crews stay booked."},
    {icon:"bar", t:"Ahead of Pace to $1.8M", d:"Booked revenue reached $1.44M — 80% of goal by July — carried by the spring/summer build season and a signed six-figure fall addition."},
    {icon:"clock", t:"Backlog Buys Runway", d:"5.1 months of booked work means crews are scheduled deep into Q4. The constraint has quietly shifted from finding work to building it without thinning the crew's standard."}
  ],

  comparisons:[
    {icon:"funnel", key:"pipeline", title:"PIPELINE ($)", fmt:"k",
     note:"Up $260K since February — coverage is building ahead of Q4."},
    {icon:"coins", key:"grossMargin", title:"GROSS MARGIN %", fmt:"pct",
     note:"Up 4.5 pts since February and comfortably above the 33% floor."},
    {icon:"shield", key:"quality", title:"QUALITY SCORE (/100)", fmt:"num",
     note:"A rising craftsmanship score is the metric behind premium pricing."}
  ],

  insights:[
    {icon:"people", t:"Capacity Is the Ceiling, Not Leads", d:"With 5 months of backlog, demand isn't the limit — skilled crew is. The growth lever is training people to hold the standard so the next big job doesn't dilute quality."},
    {icon:"shield", t:"Quality Is Your Pricing Power", d:"A 95 quality score is why you win premium bids. Score every completed job so the standard is measured, not assumed — and so new hires can be trained and held to it."},
    {icon:"coins", t:"Protect Margin Job by Job", d:"Tickets swing from $15K patios to $250K additions, so margin has to be defended per job. Estimate-vs-actual on labor and material keeps big jobs from quietly eroding profit."}
  ],

  actions:[
    {t:"Score Every Completed Job on Craftsmanship",
     bullets:["Define a simple 5-point scorecard: joint work, alignment, cleanliness, material match, client sign-off.","Score each finished job and review it with the crew so the standard stays visible."],
     step:"Build a one-page quality scorecard and score your last 3 completed jobs this week to set the baseline."},
    {t:"Run a Weighted Pipeline Review",
     bullets:["List every open opportunity with its dollar value and win probability; total the weighted pipeline.","Keep coverage at 3–4× next quarter and flag the big jobs that carry the year."],
     step:"Put all open estimates into one sheet with value × probability and total your weighted pipeline this week."},
    {t:"Protect Margin With Estimate-vs-Actual",
     bullets:["Compare bid vs. actual labor and material on recent jobs; feed the gaps into the next bid.","Tie a quality bonus to crews that hit both their score and their margin."],
     step:"Pull your last 3 jobs and calculate true labor + material cost against the estimate."},
    {t:"Put Your Financial Strength to Work",
     bullets:["Set a dedicated CAPEX / expansion fund for a major investment — equipment, a second crew, or a facility.","Or begin structured exit and succession planning to protect the value you've built."],

  ],

  challenge:"The focus is keeping a high-quality, high-intent pipeline lined up so signed work flows smoothly into crew availability — no idle weeks, no rushed scheduling. That means qualifying leads for fit and readiness, sequencing projects to the crew calendar, and protecting the craftsmanship standard as the schedule fills. Get that rhythm right and the business runs at full capacity without ever trading away quality for speed.",

  closing:"You've built a business people pay a premium for. Keep the pipeline full, hold the line on margin, and score every job so the standard is measured — not assumed. Do that, and you can take on more of the big work without ever thinning the quality that got you here."

const I = {
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="#fff"/></svg>',
  bar:'<svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>',
  funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>',

  people:'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M14 14.5c3 .3 6 2.6 6 5.5"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="#B0793A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="#B0793A"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>',
  lightbulb:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 21h6v-1.5H9V21zm3-19a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="#B0793A"><path d="M7 4h10v3a5 5 0 01-10 0V4zM5 5H3v2a3 3 0 003 3M19 5h2v2a3 3 0 01-3 3M10 13h4v3h-4zM8 20h8v-2H8z"/></svg>',
  coins:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.6v10.8" stroke-linecap="round"/><path d="M14.6 9.1c0-1.1-1.2-1.7-2.6-1.7s-2.6.7-2.6 1.8 1.2 1.6 2.6 1.9 2.6.8 2.6 1.9-1.2 1.7-2.6 1.7-2.6-.7-2.6-1.8" stroke-linecap="round"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 2.5v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10v-5z"/><path d="M9 12l2 2 4-4.5" stroke-linecap="round"/></svg>',
  hammer:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 5.5l5 5-2.2 2.2-5-5z"/><path d="M11.3 7.7L4 15v0l3 3 7.3-7.3"/></svg>',
  warning:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 16.5H2.5z"/><path d="M12 9.5v4.5M12 17h0"/></svg>',
  rocket:'<svg viewBox="0 0 24 24" fill="none" stroke="#1C2E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15c-1.6 1.6-2 5-2 5s3.4-.4 5-2"/><path d="M9.5 11.5A12 12 0 0116 4c3 0 4 1 4 4a12 12 0 01-7.5 6.5l-3 1-1-1z"/><circle cx="14.5" cy="9.5" r="1.4"/></svg>'
};

function logo(){
  return `<div class="logo">
    <div class="chip"></div>
    <div class="logo-txt">
      <div class="l1">LAKESIDE&nbsp;EXTERIORS</div>
    </div>
  </div>`;
}

const fmtK   = v => "$"+Math.round(v/1000)+"K";
const fmtM   = v => "$"+v.toLocaleString();
const fmtP   = v => v.toFixed(1)+"%";
const fmtN   = v => ""+Math.round(v);
function fmtBy(type,v){return type==="k"?fmtK(v):type==="money"?fmtM(v):type==="num"?fmtN(v):type==="mo"?v.toFixed(1)+"mo":fmtP(v);}

/* ---------- Page-1 trend: dual-axis line — Pipeline (left $) + Revenue booked/mo (right $) ---------- */
function lineChart(){
  const W=760,H=330, L=68,R=72,T=32,B=42;
  const pw=W-L-R, ph=H-T-B;
  const m=DATA.months.length;
  const x=i=>L+ (pw*(i/(m-1)));
  const scale=(v,mn,mx)=>T+ph-((v-mn)/(mx-mn))*ph;
  const pl=DATA.series.pipeline, bk=DATA.series.booked;
  const yPl=v=>scale(v,0,900000), yBk=v=>scale(v,0,450000);

  const path=(arr,yf)=>arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+yf(v).toFixed(1)).join(" ");
  const pts=(arr,yf,c)=>arr.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yf(v).toFixed(1)}" r="4.6" fill="${c}" stroke="#fff" stroke-width="1.6"/>`).join("");

  let grid="";
  for(let g=0;g<=900000;g+=150000){const y=yPl(g);grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e6e9ee" stroke-width="1"/><text x="${L-10}" y="${y+4}" font-size="10" fill="#8a93a3" text-anchor="end">$${g/1000}K</text>`;}
  let axBk="";[0,150000,300000,450000].forEach(v=>{const y=yBk(v);axBk+=`<text x="${W-R+16}" y="${y+4}" font-size="10" fill="#B0793A" text-anchor="start">$${v/1000}K</text>`;});
  const cap=`<text x="${L-10}" y="${T-14}" font-size="8.5" font-weight="700" fill="#1C2E52">PIPELINE</text>`+
            `<text x="${W-R+16}" y="${T-14}" font-size="8.5" font-weight="700" fill="#B0793A">REVENUE/MO</text>`;
  let xl="";DATA.months.forEach((mo,i)=>{xl+=`<text x="${x(i)}" y="${H-12}" font-size="10.5" font-weight="700" fill="#5a6474" text-anchor="middle">${mo}</text>`;});

  const plLbl=pl.map((v,i)=>`<text x="${x(i)}" y="${(yPl(v)-12).toFixed(1)}" font-size="10.5" font-weight="800" fill="#1C2E52" text-anchor="middle">${fmtK(v)}</text>`).join("");
  const bkLbl=bk.map((v,i)=>`<text x="${x(i)}" y="${(yBk(v)+18).toFixed(1)}" font-size="10.5" font-weight="800" fill="#B0793A" text-anchor="middle">${fmtK(v)}</text>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    ${grid}${axBk}${cap}
    <path d="${path(pl,yPl)}" fill="none" stroke="#1C2E52" stroke-width="2.6"/>
    <path d="${path(bk,yBk)}" fill="none" stroke="#B0793A" stroke-width="2.6"/>
    ${pts(pl,yPl,"#1C2E52")}${pts(bk,yBk,"#B0793A")}
    ${plLbl}${bkLbl}
    ${xl}
  </svg>`;
}

/* ---------- Mini vertical bar chart (array-driven) ---------- */
function barChartArr(arr,labels,fmt,alt){
  const W=300,H=150,T=26,B=22,L=6,R=6;
  const pw=W-L-R, ph=H-T-B, n=arr.length, gap=n>3?12:26;
  const bw=(pw-gap*(n-1))/n;
  const mn=Math.min(...arr), mx=Math.max(...arr);
  const lo=mn-(mx-mn)*0.6, hi=mx+(mx-mn)*0.2, rng=(hi-lo)||1;
  const y=v=>T+ph-((v-lo)/rng)*ph;
  let bars="";
  arr.forEach((v,i)=>{
    const bx=L+i*(bw+gap), by=y(v), bh=T+ph-by, last=i===n-1;
    const col= last? "#1C2E52" : (alt? "#c79a5f":"#9fb0c6");
    bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}"/>`;
    bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-6).toFixed(1)}" font-size="11" font-weight="800" fill="#1C2E52" text-anchor="middle">${fmtBy(fmt,v)}</text>`;
    bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${H-6}" font-size="10" font-weight="600" fill="#8a93a3" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:150px">${bars}</svg>`;
}

/* ---------- Donut: revenue mix ---------- */
function pieChart(data,centerTop,centerSub){
  const total=data.reduce((s,d)=>s+d.value,0);
  const cx=80,cy=80,r=64,ir=36;
  let ang=-Math.PI/2, seg="";
  data.forEach(d=>{
    const a0=ang, a1=ang+(d.value/total)*Math.PI*2; ang=a1;
    const large=(a1-a0)>Math.PI?1:0;
    const p=(rad,a)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
    const[o0x,o0y]=p(r,a0),[o1x,o1y]=p(r,a1),[i1x,i1y]=p(ir,a1),[i0x,i0y]=p(ir,a0);
    seg+=`<path d="M${o0x} ${o0y} A${r} ${r} 0 ${large} 1 ${o1x} ${o1y} L${i1x} ${i1y} A${ir} ${ir} 0 ${large} 0 ${i0x} ${i0y} Z" fill="${d.color}" stroke="#f6f7f9" stroke-width="1.4"/>`;
  });
  const raw=data.map(d=>d.value/total*100), fl=raw.map(v=>Math.floor(v));
  const rem=Math.round(100-fl.reduce((a,b)=>a+b,0));
  const ord=raw.map((v,i)=>({i,f:v-fl[i]})).sort((a,b)=>b.f-a.f);
  const pct=fl.slice(); for(let k=0;k<rem;k++) pct[ord[k].i]++;
  const legend=data.map((d,i)=>`<div class="row"><i style="background:${d.color}"></i>${d.label}<span class="v">${pct[i]}%</span></div>`).join("");
  return `<svg viewBox="0 0 160 160" width="100%" style="max-height:150px">${seg}
    <text x="80" y="77" font-size="17" font-weight="800" fill="#1C2E52" text-anchor="middle">${centerTop}</text>
    <text x="80" y="93" font-size="8.5" font-weight="700" fill="#8a93a3" text-anchor="middle" letter-spacing="1.5">${centerSub}</text>
  </svg>
  <div class="pie-legend">${legend}</div>`;
}

function barChart(key,fmt){
  const arr=DATA.series[key];
  const W=340,H=130,T=22,B=20,L=4,R=4;
  const pw=W-L-R, ph=H-T-B, n=arr.length, gap=10;
  const bw=(pw-gap*(n-1))/n;
  const mn=Math.min(...arr), mx=Math.max(...arr);
  const lo=mn-(mx-mn)*0.6, hi=mx+(mx-mn)*0.15;
  const y=v=>T+ph-((v-lo)/(hi-lo))*ph;
  let bars="";
  arr.forEach((v,i)=>{
    const bx=L+i*(bw+gap), by=y(v), bh=T+ph-by;
    const last=i===n-1;
    bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${last?"#1C2E52":"#9fb0c6"}"/>`;
    bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${(by-6).toFixed(1)}" font-size="10" font-weight="800" fill="${last?"#1C2E52":"#5a6474"}" text-anchor="middle">${fmtBy(fmt,v)}</text>`;
    bars+=`<text x="${(bx+bw/2).toFixed(1)}" y="${H-6}" font-size="9.5" font-weight="600" fill="#8a93a3" text-anchor="middle">${DATA.monthsShort[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
}

function kpiIconBg(icon){return icon==="coins"?"var(--gold)":icon==="shield"?"var(--gold)":icon==="clock"?"var(--slate)":"var(--navy)";}

function header(showDate){

  </div>`;
}
